project_id = "mitrex-dlv"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enable_signup = false
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]

[auth.email]
# Email provider must stay enabled for OTP login. New-user creation is blocked by [auth] enable_signup = false.
enable_signup = true
enable_confirmations = false
otp_length = 8
otp_expiry = 900

[auth.email.template.magic_link]
subject = "Your DLV sign-in code"
content_path = "./supabase/templates/magic_link.html"

[inbucket]
enabled = true
port = 54324

[studio]
enabled = false

[auth.rate_limit]
email_sent = 1000
sign_in_sign_ups = 1000
